version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/ci
    schedule:
      interval: weekly
    groups:
      ci-tools-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
    ignore:
      # firebase-admin 14 removes the legacy namespace API (admin.firestore.*)
      # that functions/index.js uses. Migrate and test before taking it.
      - dependency-name: firebase-admin
        versions: ["14.x"]
