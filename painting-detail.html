<head>
  <meta charset="UTF-8"/>
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="color-scheme" content="light"/>
  <meta name="theme-color" content="#fbf8ee"/>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('al_theme');
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e){}
    })();
    function applyThemeMeta(theme) {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#fbf8ee' : '#0a0a0a');
    }
    function setTheme(theme) {
      theme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('al_theme', theme); } catch(e){}
      applyThemeMeta(theme);
      document.querySelectorAll('.theme-toggle-btn').forEach(function(btn){ btn.classList.toggle('is-light', theme === 'light'); });
    }
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    }
  </script>

  <!-- Inlined so the loading screen paints even if css or fonts are still
       in flight on a slow connection. -->
  <style>
    #siteLoader { position: fixed; inset: 0; z-index: 9999; background: #0b0a08; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; transition: opacity .5s ease, visibility .5s ease; }
    #siteLoader img { width: 76px; height: 76px; animation: siteLoaderPulse 1.6s ease-in-out infinite; }
    #siteLoader .loadbar { width: 180px; height: 3px; border-radius: 100px; background: rgba(255,255,255,.12); overflow: hidden; }
    #siteLoader .loadbar span { display: block; height: 100%; width: 40%; border-radius: 100px; background: linear-gradient(90deg, #a5801f, #e8c874, #a5801f); animation: siteLoaderBar 1.3s ease-in-out infinite; }
    #siteLoader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    body.is-loading { overflow: hidden; }
    @keyframes siteLoaderPulse { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes siteLoaderBar { 0% { transform: translateX(-100%); } 50% { transform: translateX(60%); } 100% { transform: translateX(220%); } }
  </style>
</head>
<body class="is-loading">
  <div id="siteLoader" role="status" aria-live="polite" aria-label="Loading">
    <img src="/images/logo/logo.png" alt="" />
    <div class="loadbar"><span></span></div>
  </div>
  <script>
    (function () {
      function hideLoader() {
        var el = document.getElementById('siteLoader');
        if (!el) return;
        el.classList.add('is-hidden');
        document.body.classList.remove('is-loading');
        setTimeout(function () { el.remove(); }, 600);
      }
      if (document.readyState === 'complete') hideLoader();
      else window.addEventListener('load', hideLoader);
    })();
  </script>

      <button class="lang-btn active" onclick="setLang('en')" style="min-width:36px;">EN</button>

<script>
// Shared painting data — mirrors arts.html products.
// Edit this array (or inject new items) to add new paintings. Cards in arts.html
// already link here via /arts/<slugified-name>, so new entries automatically work end-to-end.
const PAINTINGS = [
  {id:1,name:'Desert Horizons',      artist:'Layla Al-Rashidi',price:'380.00 JOD',category:'painting',   medium:'Oil on Canvas', size:'80cm × 120cm',       description:'Sweeping dunes captured in layered oil strokes — a meditation on the vastness and stillness of the Arabian desert at dawn.', hasCert:true,  img:'/images/arts/product-01-desert-horizons.webp'},
  {id:2,name:'Golden City',          artist:'Omar Nasser',     price:'520.00 JOD',category:'painting',   medium:'Acrylic',       size:'100cm × 100cm',      description:'A stylised aerial view of old Amman at golden hour, rendered in gold leaf and deep ochre acrylics.', hasCert:true,  img:'/images/arts/product-02-golden-city.webp'},
  {id:3,name:'Calligraphy in Motion',artist:'Hind Khalifa',    price:'290.00 JOD',category:'print',      medium:'Giclée Print',  size:'60cm × 80cm',        description:'A contemporary interpretation of classical Arabic calligraphy, printed in limited edition of 50.', hasCert:false, img:'/images/arts/product-03-calligraphy-motion.webp'},
  {id:4,name:'Layers of Time',       artist:'Rami Barakat',    price:'640.00 JOD',category:'painting',   medium:'Mixed Media',   size:'90cm × 130cm',       description:'Mixed-media on canvas exploring the strata of memory, identity, and place through textured geological forms.', hasCert:true,  img:'/images/arts/product-04-layers-of-time.webp'},
  {id:5,name:'Light & Shadow',       artist:'Nour Zaki',       price:'220.00 JOD',category:'photography',medium:'Fine Art Print',size:'50cm × 70cm',        description:'A black-and-white study of morning light cutting through an old Amman alleyway, printed on archival fibre paper.', hasCert:false, img:'/images/arts/product-05-light-shadow.webp'},
  {id:6,name:'Urban Fragments',      artist:'Tarek Mansour',   price:'480.00 JOD',category:'photography',medium:'C-Print',       size:'80cm × 100cm',       description:'Large-format colour photograph documenting abstract compositions found in the textures of modern city walls.', hasCert:true,  img:'/images/arts/product-06-urban-fragments.webp'},
  {id:7,name:'Form & Void',          artist:'Dina Al-Sayed',   price:'850.00 JOD',category:'sculpture',  medium:'Bronze',        size:'45cm × 30cm × 30cm', description:'A cast-bronze sculpture that plays with positive and negative space — a tactile meditation on presence and absence.', hasCert:true,  img:'/images/arts/product-07-form-void.webp'},
  {id:8,name:'Wadi Reflections',     artist:'Samir Haddad',    price:'310.00 JOD',category:'print',      medium:'Lithograph',    size:'60cm × 75cm',        description:'A hand-pulled lithograph of mirrored canyon waters in Wadi Rum, produced in a numbered edition of 30.', hasCert:false, img:'/images/arts/product-08-wadi-reflections.webp'},
  {id:9,name:'Colour Study No.7',    artist:'Lina Yousef',     price:'195.00 JOD',category:'painting',   medium:'Watercolour',   size:'40cm × 50cm',        description:'A small jewel of a watercolour — one of a series exploring the colour palettes of spring in the Jordan valley.', hasCert:true,  img:'/images/arts/product-09-colour-study.webp'},
];

const I18N = {
  en:{
    bcHome:'Home', bcArts:'Arts', navBack:'← Back to Gallery',
    lblArtist:'Artist', lblMedium:'Medium', lblSize:'Size', lblCategory:'Category',
    certYes:'Authenticity Certificate Included', certNo:'No Certificate',
    btnBuy:'Add to Cart', btnEnquire:'Enquire',
    notFoundH:'Artwork Not Found', notFoundP:'We could not find the artwork you requested.',
    backBtn:'Back to Gallery',
  },
  ar:{
    bcHome:'الرئيسية', bcArts:'الفنون', navBack:'← العودة للمعرض',
    lblArtist:'الفنان', lblMedium:'الخامة', lblSize:'المقاس', lblCategory:'الفئة',
    certYes:'شهادة أصالة مرفقة', certNo:'بدون شهادة',
    btnBuy:'أضف إلى السلة', btnEnquire:'استفسار',
    notFoundH:'العمل غير موجود', notFoundP:'تعذر العثور على العمل المطلوب.',
    backBtn:'العودة للمعرض',
  }
};

function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
const params = new URLSearchParams(location.search);
const pathMatch = location.pathname.match(/^\/arts\/([^\/]+)\/?$/);
const pSlug = pathMatch ? decodeURIComponent(pathMatch[1]) : null;
const id = parseInt(params.get('id')) || 0;
const painting = (pSlug && PAINTINGS.find(p=>slugify(p.name)===pSlug)) || PAINTINGS.find(p=>p.id===id);
const canonicalEl = document.getElementById('canonicalLink');
if (canonicalEl && painting) {
  const canonicalUrl = window.location.origin + '/arts/' + slugify(painting.name);
  canonicalEl.href = canonicalUrl;
  const ogUrlEl = document.getElementById('ogUrl');
  if (ogUrlEl) ogUrlEl.setAttribute('content', canonicalUrl);
  const ogTitleEl = document.getElementById('ogTitle');
  if (ogTitleEl) ogTitleEl.setAttribute('content', painting.name + ' – Alrayyan Arts');
}

function render(lang){
  const t = I18N[lang] || I18N.en;
  const root = document.getElementById('page-root');
  if (!painting){
    document.getElementById('bc-name').textContent = '—';
    root.innerHTML = `<div class="not-found">
      <h2>${t.notFoundH}</h2>
      <p>${t.notFoundP}</p>
      <a href="/arts" class="btn-ghost">${t.backBtn}</a>
    </div>`;
    return;
  }
  document.title = painting.name + ' – Alrayyan Arts';
  document.getElementById('bc-name').textContent = painting.name;
  document.getElementById('nav-back-btn').textContent = t.navBack;
  root.innerHTML = `
    <div class="wrap">
      <div class="art-img-box">
        <img src="${painting.img}" alt="${painting.name}" decoding="async" loading="lazy"/>
      </div>
      <div class="art-meta">
        <p class="eye">${painting.medium}</p>
        <h1 class="title">${painting.name}</h1>
        <div class="artist">${t.lblArtist}: ${painting.artist}</div>
        <div class="gold-line"></div>
        <div class="specs">
          <div class="spec"><div class="spec-l">${t.lblSize}</div><div class="spec-v">${painting.size}</div></div>
          <div class="spec"><div class="spec-l">${t.lblMedium}</div><div class="spec-v">${painting.medium}</div></div>
          <div class="spec"><div class="spec-l">${t.lblArtist}</div><div class="spec-v">${painting.artist}</div></div>
          <div class="spec"><div class="spec-l">${t.lblCategory}</div><div class="spec-v">${painting.category}</div></div>
        </div>
        <p class="desc">${painting.description}</p>
        <div class="price-row"><div class="price">${painting.price}</div></div>
        <div class="cert ${painting.hasCert?'ok':'no'}">
          ${painting.hasCert ? '✅ ' + t.certYes : '❌ ' + t.certNo}
        </div>
        <div class="buy-row">
          <button class="btn-gold" onclick="addToCart()">${t.btnBuy}</button>
          <a href="mailto:info@alrayyanjo.com?subject=Enquiry about ${encodeURIComponent(painting.name)}" class="btn-ghost">${t.btnEnquire}</a>
        </div>
      </div>
    </div>`;
}

function addToCart(){
  if (!painting) return;
  const cart = JSON.parse(localStorage.getItem('aa_cart')||'[]');
  const ex = cart.find(x=>x.id===painting.id);
  if (ex) ex.qty++; else cart.push({...painting, qty:1});
  localStorage.setItem('aa_cart', JSON.stringify(cart));
  alert((document.documentElement.lang==='ar' ? 'تمت إضافة "' : 'Added "') + painting.name + (document.documentElement.lang==='ar' ? '" إلى السلة' : '" to cart'));
}

function setLang(lang){
  localStorage.setItem('al_lang', lang);
  document.documentElement.lang = lang==='ar' ? 'ar' : 'en';
  document.documentElement.dir  = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.textContent.trim()===(lang==='ar'?'AR':'EN')));
  const t = I18N[lang] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (t[k]) el.textContent = t[k];
  });
  render(lang);
}

(function(){
  const saved = localStorage.getItem('al_lang') || 'en';
  setLang(saved);
})();
</script>
