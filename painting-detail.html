<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artwork Detail – Alrayyan Arts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#0a0a0a;
      --accent:#C9A84C;
      --accent-light:#e6c971;
      --accent-dim:#8a6f28;
      --deep:#141414;
      --parchment:#f5efe0;
      --off-white:#efe7d4;
      --muted:#8b8576;
      --t:0.3s cubic-bezier(0.4,0,0.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',sans-serif;background:var(--primary);color:var(--parchment);overflow-x:hidden;}
    html[dir="rtl"] body{font-family:'Cairo','DM Sans',sans-serif;}
    a{text-decoration:none;color:inherit;}
    img{max-width:100%;display:block;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:var(--primary);}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

    nav{position:fixed;top:0;left:0;right:0;z-index:900;padding:0 5%;height:72px;
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(10,10,10,0.97);backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(201,168,76,0.15);transition:var(--t);}
    .nav-brand{font-family:'IM Fell English',serif;font-size:1.25rem;letter-spacing:2px;}
    .nav-brand em{font-style:italic;color:var(--accent-light);}
    .nav-right{display:flex;align-items:center;gap:12px;}
    .nav-back{font-size:.66rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
      color:var(--accent);border:1px solid rgba(201,168,76,0.35);padding:7px 14px;border-radius:2px;transition:var(--t);}
    .nav-back:hover{background:rgba(201,168,76,0.1);}
    .lang-sw{display:flex;}
    .lang-btn{background:none;border:1px solid rgba(201,168,76,0.3);color:var(--muted);
      font-family:'DM Sans',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:1.5px;
      text-transform:uppercase;padding:5px 10px;cursor:pointer;transition:.3s;}
    .lang-btn:first-child{border-radius:2px 0 0 2px;border-right:none;}
    .lang-btn:last-child{border-radius:0 2px 2px 0;}
    .lang-btn.active{background:var(--accent);color:var(--primary);border-color:var(--accent);}

    .breadcrumb{padding:92px 5% 14px;font-size:.68rem;color:var(--muted);display:flex;gap:8px;}
    .breadcrumb a{color:var(--accent);}
    .breadcrumb span.sep{color:rgba(201,168,76,0.3);}

    .wrap{max-width:1200px;margin:0 auto;padding:24px 5% 80px;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;}
    .art-img-box{background:var(--deep);border:1px solid rgba(201,168,76,0.12);padding:18px;}
    .art-img-box img{width:100%;height:auto;max-height:720px;object-fit:contain;background:#000;}
    .art-meta{padding-top:8px;}
    .eye{font-size:.62rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
    .title{font-family:'IM Fell English',serif;font-size:clamp(1.8rem,3.2vw,2.8rem);color:var(--parchment);line-height:1.15;margin-bottom:8px;}
    .artist{font-size:.85rem;color:var(--accent-light);letter-spacing:1px;margin-bottom:22px;text-transform:uppercase;}
    .gold-line{width:46px;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin:0 0 26px;}
    .specs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:26px;border:1px solid rgba(201,168,76,0.12);}
    .spec{padding:14px 18px;border-right:1px solid rgba(201,168,76,0.08);border-bottom:1px solid rgba(201,168,76,0.08);}
    .spec:nth-child(2n){border-right:none;}
    .spec:nth-last-child(-n+2){border-bottom:none;}
    .spec-l{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
    .spec-v{font-size:.85rem;color:var(--parchment);font-weight:500;}
    .desc{font-size:.9rem;line-height:1.9;color:var(--off-white);margin-bottom:26px;}
    .price-row{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;}
    .price{font-family:'IM Fell English',serif;font-size:1.9rem;color:var(--accent-light);}
    .cert{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:3px;font-size:.74rem;font-weight:600;letter-spacing:.5px;margin-bottom:24px;}
    .cert.ok{background:rgba(143,214,135,0.1);border:1px solid rgba(143,214,135,0.4);color:#8FD687;}
    .cert.no{background:rgba(201,115,115,0.1);border:1px solid rgba(201,115,115,0.4);color:#c97373;}
    .buy-row{display:flex;gap:10px;flex-wrap:wrap;}
    .btn-gold{background:linear-gradient(135deg,var(--accent-dim),var(--accent),var(--accent-light));color:var(--primary);
      font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
      padding:13px 28px;border:none;border-radius:2px;cursor:pointer;transition:var(--t);}
    .btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(201,168,76,0.3);}
    .btn-ghost{background:transparent;color:var(--accent);
      font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;
      padding:12px 26px;border:1px solid rgba(201,168,76,0.4);border-radius:2px;cursor:pointer;transition:var(--t);}
    .btn-ghost:hover{background:rgba(201,168,76,0.08);}

    footer{background:#050505;border-top:1px solid rgba(201,168,76,0.1);padding:28px 5% 20px;
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
    .f-brand{font-family:'IM Fell English',serif;font-size:1.05rem;letter-spacing:2px;}
    .f-brand em{color:var(--accent-light);font-style:italic;}
    .f-copy{font-size:.68rem;color:rgba(255,255,255,0.22);}

    .not-found{max-width:640px;margin:140px auto;padding:0 5%;text-align:center;}
    .not-found h2{font-family:'IM Fell English',serif;font-size:2rem;margin-bottom:10px;}
    .not-found p{color:var(--muted);margin-bottom:22px;}

    @media(max-width:900px){
      .wrap{grid-template-columns:1fr;gap:32px;}
      .specs{grid-template-columns:1fr;}
      .spec{border-right:none;}
      .spec:not(:last-child){border-bottom:1px solid rgba(201,168,76,0.08);}
    }
  </style>
</head>
<body>

<nav>
  <a href="arts.html"><div class="nav-brand">Alrayyan <em>Arts</em></div></a>
  <div class="nav-right">
    <div class="lang-sw">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('ar')">AR</button>
    </div>
    <a href="arts.html#shop" class="nav-back" id="nav-back-btn">← Back to Gallery</a>
  </div>
</nav>

<div class="breadcrumb">
  <a href="index.html" data-i18n="bcHome">Home</a>
  <span class="sep">/</span>
  <a href="arts.html" data-i18n="bcArts">Arts</a>
  <span class="sep">/</span>
  <span id="bc-name">Artwork</span>
</div>

<div id="page-root"></div>

<footer>
  <div class="f-brand">Alrayyan <em>Arts</em></div>
  <div class="f-copy">© 2025 Alrayyan Calligraphy Arts. All rights reserved.</div>
</footer>

<script>
// Shared painting data — mirrors arts.html products.
// Edit this array (or inject new items) to add new paintings. Cards in arts.html
// already link here via ?id=<id>, so new entries automatically work end-to-end.
const PAINTINGS = [
  {id:1,name:'Desert Horizons',      artist:'Layla Al-Rashidi',price:'380.00 JOD',category:'painting',   medium:'Oil on Canvas', size:'80cm × 120cm',       description:'Sweeping dunes captured in layered oil strokes — a meditation on the vastness and stillness of the Arabian desert at dawn.', hasCert:true,  img:'images/arts-product-01-desert-horizons.jpg'},
  {id:2,name:'Golden City',          artist:'Omar Nasser',     price:'520.00 JOD',category:'painting',   medium:'Acrylic',       size:'100cm × 100cm',      description:'A stylised aerial view of old Amman at golden hour, rendered in gold leaf and deep ochre acrylics.', hasCert:true,  img:'images/arts-product-02-golden-city.jpg'},
  {id:3,name:'Calligraphy in Motion',artist:'Hind Khalifa',    price:'290.00 JOD',category:'print',      medium:'Giclée Print',  size:'60cm × 80cm',        description:'A contemporary interpretation of classical Arabic calligraphy, printed in limited edition of 50.', hasCert:false, img:'images/arts-product-03-calligraphy-motion.jpg'},
  {id:4,name:'Layers of Time',       artist:'Rami Barakat',    price:'640.00 JOD',category:'painting',   medium:'Mixed Media',   size:'90cm × 130cm',       description:'Mixed-media on canvas exploring the strata of memory, identity, and place through textured geological forms.', hasCert:true,  img:'images/arts-product-04-layers-of-time.jpg'},
  {id:5,name:'Light & Shadow',       artist:'Nour Zaki',       price:'220.00 JOD',category:'photography',medium:'Fine Art Print',size:'50cm × 70cm',        description:'A black-and-white study of morning light cutting through an old Amman alleyway, printed on archival fibre paper.', hasCert:false, img:'images/arts-product-05-light-shadow.jpg'},
  {id:6,name:'Urban Fragments',      artist:'Tarek Mansour',   price:'480.00 JOD',category:'photography',medium:'C-Print',       size:'80cm × 100cm',       description:'Large-format colour photograph documenting abstract compositions found in the textures of modern city walls.', hasCert:true,  img:'images/arts-product-06-urban-fragments.jpg'},
  {id:7,name:'Form & Void',          artist:'Dina Al-Sayed',   price:'850.00 JOD',category:'sculpture',  medium:'Bronze',        size:'45cm × 30cm × 30cm', description:'A cast-bronze sculpture that plays with positive and negative space — a tactile meditation on presence and absence.', hasCert:true,  img:'images/arts-product-07-form-void.jpg'},
  {id:8,name:'Wadi Reflections',     artist:'Samir Haddad',    price:'310.00 JOD',category:'print',      medium:'Lithograph',    size:'60cm × 75cm',        description:'A hand-pulled lithograph of mirrored canyon waters in Wadi Rum, produced in a numbered edition of 30.', hasCert:false, img:'images/arts-product-08-wadi-reflections.jpg'},
  {id:9,name:'Colour Study No.7',    artist:'Lina Yousef',     price:'195.00 JOD',category:'painting',   medium:'Watercolour',   size:'40cm × 50cm',        description:'A small jewel of a watercolour — one of a series exploring the colour palettes of spring in the Jordan valley.', hasCert:true,  img:'images/arts-product-09-colour-study.jpg'},
];

const I18N = {
  en:{
    bcHome:'Home', bcArts:'Arts', navBack:'← Back to Gallery',
    lblArtist:'Artist', lblMedium:'Medium', lblSize:'Size', lblCategory:'Category',
    certYes:'Authenticity Certificate Included', certNo:'No Certificate',
    btnBuy:'Add to Cart', btnEnquire:'Enquire',
    notFoundH:'Artwork Not Found', notFoundP:'We could not find the artwork you requested.',
    backBtn:'Back to Gallery',
  },
  ar:{
    bcHome:'الرئيسية', bcArts:'الفنون', navBack:'← العودة للمعرض',
    lblArtist:'الفنان', lblMedium:'الخامة', lblSize:'المقاس', lblCategory:'الفئة',
    certYes:'شهادة أصالة مرفقة', certNo:'بدون شهادة',
    btnBuy:'أضف إلى السلة', btnEnquire:'استفسار',
    notFoundH:'العمل غير موجود', notFoundP:'تعذر العثور على العمل المطلوب.',
    backBtn:'العودة للمعرض',
  }
};

const params = new URLSearchParams(location.search);
const id = parseInt(params.get('id')) || 0;
const painting = PAINTINGS.find(p=>p.id===id);

function render(lang){
  const t = I18N[lang] || I18N.en;
  const root = document.getElementById('page-root');
  if (!painting){
    document.getElementById('bc-name').textContent = '—';
    root.innerHTML = `<div class="not-found">
      <h2>${t.notFoundH}</h2>
      <p>${t.notFoundP}</p>
      <a href="arts.html" class="btn-ghost">${t.backBtn}</a>
    </div>`;
    return;
  }
  document.title = painting.name + ' – Alrayyan Arts';
  document.getElementById('bc-name').textContent = painting.name;
  document.getElementById('nav-back-btn').textContent = t.navBack;
  root.innerHTML = `
    <div class="wrap">
      <div class="art-img-box">
        <img src="${painting.img}" alt="${painting.name}"/>
      </div>
      <div class="art-meta">
        <p class="eye">${painting.medium}</p>
        <h1 class="title">${painting.name}</h1>
        <div class="artist">${t.lblArtist}: ${painting.artist}</div>
        <div class="gold-line"></div>
        <div class="specs">
          <div class="spec"><div class="spec-l">${t.lblSize}</div><div class="spec-v">${painting.size}</div></div>
          <div class="spec"><div class="spec-l">${t.lblMedium}</div><div class="spec-v">${painting.medium}</div></div>
          <div class="spec"><div class="spec-l">${t.lblArtist}</div><div class="spec-v">${painting.artist}</div></div>
          <div class="spec"><div class="spec-l">${t.lblCategory}</div><div class="spec-v">${painting.category}</div></div>
        </div>
        <p class="desc">${painting.description}</p>
        <div class="price-row"><div class="price">${painting.price}</div></div>
        <div class="cert ${painting.hasCert?'ok':'no'}">
          ${painting.hasCert ? '✅ ' + t.certYes : '❌ ' + t.certNo}
        </div>
        <div class="buy-row">
          <button class="btn-gold" onclick="addToCart()">${t.btnBuy}</button>
          <a href="mailto:info@alrayyangroup.com?subject=Enquiry about ${encodeURIComponent(painting.name)}" class="btn-ghost">${t.btnEnquire}</a>
        </div>
      </div>
    </div>`;
}

function addToCart(){
  if (!painting) return;
  const cart = JSON.parse(localStorage.getItem('aa_cart')||'[]');
  const ex = cart.find(x=>x.id===painting.id);
  if (ex) ex.qty++; else cart.push({...painting, qty:1});
  localStorage.setItem('aa_cart', JSON.stringify(cart));
  alert((document.documentElement.lang==='ar' ? 'تمت إضافة "' : 'Added "') + painting.name + (document.documentElement.lang==='ar' ? '" إلى السلة' : '" to cart'));
}

function setLang(lang){
  localStorage.setItem('al_lang', lang);
  document.documentElement.lang = lang==='ar' ? 'ar' : 'en';
  document.documentElement.dir  = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.textContent.trim()===(lang==='ar'?'AR':'EN')));
  const t = I18N[lang] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (t[k]) el.textContent = t[k];
  });
  render(lang);
}

(function(){
  const saved = localStorage.getItem('al_lang') || 'en';
  setLang(saved);
})();
</script>
</body>
</html>
