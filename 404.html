<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found – Alrayyan Group</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/png" href="images/logo/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#050505;color:#e8e0cc;font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    .code{font-family:'Cormorant Garamond',serif;font-size:7rem;font-weight:300;color:#d4af37;line-height:1;letter-spacing:-4px;}
    .title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;margin:1rem 0 0.5rem;letter-spacing:2px;}
    .sub{font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;color:rgba(212,175,55,0.6);margin-bottom:2.5rem;}
    .divider{width:48px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:1.5rem auto;}
    .btn{display:inline-block;padding:12px 32px;border:1px solid #d4af37;color:#d4af37;text-decoration:none;font-family:'Montserrat',sans-serif;font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;border-radius:2px;transition:all .3s;}
    .btn:hover{background:#d4af37;color:#050505;}
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1 class="title">Page Not Found</h1>
  <p class="sub">The page you are looking for does not exist</p>
  <div class="divider"></div>
  <a href="/" class="btn">Return Home</a>
</body>
</html>
