<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="color-scheme" content="dark"/>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('al_theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e){}
    })();
  </script>
  <title>Page Not Found – Alrayyan Group</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/png" href="images/logo/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{color-scheme:dark;--bg:#050505;--text:#e8e0cc;--gold:#d4af37;--gold-dim:rgba(212,175,55,0.6);}
    html[data-theme="light"]{color-scheme:light;--bg:#fdfaf3;--text:#1f1b10;--gold-dim:rgba(163,130,31,0.7);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;}
    .code{font-family:'Cormorant Garamond',serif;font-size:7rem;font-weight:300;color:var(--gold);line-height:1;letter-spacing:-4px;}
    .title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;margin:1rem 0 0.5rem;letter-spacing:2px;}
    .sub{font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dim);margin-bottom:2.5rem;}
    .divider{width:48px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:1.5rem auto;}
    .btn{display:inline-block;padding:12px 32px;border:1px solid #d4af37;color:var(--gold);text-decoration:none;font-family:'Montserrat',sans-serif;font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;border-radius:2px;transition:all .3s;}
    .btn:hover{background:#d4af37;color:#050505;}
    .theme-toggle-btn{position:fixed;top:20px;right:20px;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:none;border:1px solid rgba(212,175,55,0.3);border-radius:50%;color:var(--gold);cursor:pointer;overflow:hidden;transition:.3s;}
    .theme-toggle-btn:hover{border-color:var(--gold);background:rgba(212,175,55,.08);}
    .theme-toggle-btn .theme-icon-sun,.theme-toggle-btn .theme-icon-moon{position:absolute;font-size:.9rem;line-height:1;transition:.3s;}
    .theme-toggle-btn .theme-icon-sun{opacity:0;transform:scale(.4) rotate(-90deg);}
    .theme-toggle-btn .theme-icon-moon{opacity:1;transform:scale(1) rotate(0deg);}
    .theme-toggle-btn.is-light .theme-icon-sun{opacity:1;transform:scale(1) rotate(0deg);}
    .theme-toggle-btn.is-light .theme-icon-moon{opacity:0;transform:scale(.4) rotate(90deg);}
  </style>
</head>
<body>
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle light / dark mode" title="Toggle light / dark mode">
    <span class="theme-icon-sun">☀</span>
    <span class="theme-icon-moon">☾</span>
  </button>
  <div class="code">404</div>
  <h1 class="title">Page Not Found</h1>
  <p class="sub">The page you are looking for does not exist</p>
  <div class="divider"></div>
  <a href="/" class="btn">Return Home</a>
  <script>
    function setTheme(theme) {
      theme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('al_theme', theme); } catch(e){}
      document.querySelectorAll('.theme-toggle-btn').forEach(function(btn){ btn.classList.toggle('is-light', theme === 'light'); });
    }
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      setTheme(current === 'light' ? 'dark' : 'light');
    }
    setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  </script>
</body>
</html>
